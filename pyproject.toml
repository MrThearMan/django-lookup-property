[project]
name = "django-lookup-property"
version = "0.2.2"
description = "Django model properties that are also lookup expressions."
authors = [
    { name = "Matti Lamppu", email = "lamppu.matti.akseli@gmail.com" },
]
license = "MIT"
readme = "README.md"
keywords = [
    "django",
    "lookup",
    "property",
    "orm",
    "model",
    "extension",
]
classifiers = [
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.17",
]

[project.urls]
"Homepage" = "https://mrthearman.github.io/django-lookup-property"
"Repository" = "https://github.com/MrThearMan/django-lookup-property"
"Bug Tracker" = "https://github.com/MrThearMan/django-lookup-property/issues"
"Documentation" = "https://mrthearman.github.io/django-lookup-property"

[dependency-groups]
# Development installs the library itself, so that "uv run" needs no extra flags.
dev = [
    "django-lookup-property",
]
test = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "coverage==7.16.2",
    "freezegun==1.5.5",
    "nox==2026.8.17",
    "factory-boy==3.3.3",
    "psycopg[binary]==3.3.6",
]
docs = [
    "mkdocs==1.6.1",
    "pymdown-extensions==12.1",
    "mkdocs-mermaid2-plugin==1.2.3",
]
lint = [
    "prek==0.5.5",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "django-stubs==6.1.2",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
# Lets the "dev" group name this project.
django-lookup-property = { workspace = true }

[tool.uv.build-backend]
# The package is at the repository root, not under "src".
module-root = ""
module-name = [
    "lookup_property",
]

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
]
exclude = [
    "^tests/",
    "^docs/",
    "^site/",
]

[tool.django-stubs]
django_settings_module = "example_project.project.settings"

[tool.coverage.run]
relative_files = true

[tool.coverage.report]
omit = [
    "tests/*",
    "docs/*",
    ".venv/*",
    ".tox/*",
]
exclude_lines = [
    "if TYPE_CHECKING:",
    "except ImportError:",
    "pragma: no cover",
    "pass",
    "def __repr__",
    "def __str__",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.project.settings"
addopts = "-p tests.plugins --disable-warnings"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
